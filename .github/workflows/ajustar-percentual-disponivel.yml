name: Ajustar percentual disponível

on:
  push:
    paths:
      - '.github/workflows/ajustar-percentual-disponivel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar gráfico orçado x realizado
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          css='''\n/* === disponível por categoria === */\n.budget-bar{grid-template-columns:145px 1fr 170px}.budget-bar .numbers{line-height:1.35}.budget-bar .availability{display:block;margin-top:3px;font-size:9px;font-weight:800}.budget-bar .availability.ok{color:var(--ok)}.budget-bar .availability.warn{color:var(--bad)}\n@media(max-width:760px){.budget-bar{grid-template-columns:100px 1fr 120px}}\n'''
          if '/* === disponível por categoria === */' not in s:
              s=s.replace('</style>',css+'</style>',1)

          pattern=r"function renderBudgetVariance\(cats\)\{.*?\}\n"
          replacement="""function renderBudgetVariance(cats){let a=[...cats].sort((x,y)=>(y.used-y.budget)-(x.used-x.budget)).slice(0,7),max=Math.max(...a.map(x=>Math.max(x.used,x.budget)),1);$('#budgetVariance').innerHTML=a.map(x=>{let available=x.budget-x.used,availablePct=x.budget>0?Math.max(0,available/x.budget*100):0,overPct=x.budget>0&&x.used>x.budget?(x.used-x.budget)/x.budget*100:0,txt=available>=0?`Disponível: ${money(available)} · ${availablePct.toFixed(0)}%`:`Excedido: ${money(Math.abs(available))} · ${overPct.toFixed(0)}% acima`,cls=available>=0?'ok':'warn';return`<div class=\"budget-bar\"><span>${x.name}</span><div class=\"mini\"><i style=\"width:${Math.min(100,x.used/max*100)}%;background:${x.used>x.budget?'#ee7566':'#6ba4ae'}\"></i></div><div class=\"numbers\">${money(x.used)} / ${money(x.budget)}<span class=\"availability ${cls}\">${txt}</span></div></div>`}).join('')}\n"""
          ns,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('Função renderBudgetVariance não encontrada para ajuste')
          p.write_text(ns,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Mostra percentual disponível por categoria"
          git push
